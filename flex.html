    <title>Flex Layout</title>
    <style>
.box{
    border: 1px solid blue;
    height: 100px;
    justify-content: space-between;

}
.container{
    display: flex;

}

.pic-container{

}

}

.user-container{

    justify-content: space-around;
    flex-wrap: wrap;
    gap: 30px;
}
.user{
    border: 3px solid paleturquoise;
}
